# Local development infrastructure.
#
#   docker compose up -d      start in the background
#   docker compose ps         status + health
#   docker compose logs -f db follow logs
#   docker compose down       stop containers, KEEP data
#   docker compose down -v    stop containers, DESTROY data
#
# Note there is no `version:` key — it has been obsolete in Compose v2 for years
# and now only produces a warning.

services:
  db:
    # Pinned deliberately. `latest` would silently bump major versions and cost
    # you a day of debugging. PostGIS 3.4 on PostgreSQL 16.
    image: postgis/postgis:16-3.4
    container_name: househunting-db

    environment:
      # These three variable names are a convention of the postgres image's
      # entrypoint script; on first start it creates this user and database.
      # They are read ONLY when the volume is empty — changing them later has
      # no effect until the volume is destroyed.
      POSTGRES_DB: househunting
      POSTGRES_USER: househunting
      # Local-only credential. Production secrets never live in this file;
      # they arrive as environment variables from the host. See .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}

    ports:
      # HOST:CONTAINER — change the left side to run alongside another Postgres.
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # Named volume, managed by Docker. Survives `down`, destroyed by `down -v`.
      # Deliberately NOT a bind mount into the project folder: that would expose
      # Postgres internals to Git and to Windows filesystem permission issues.
      - db-data:/var/lib/postgresql/data

    healthcheck:
      # A postgres container reports "running" several seconds before it accepts
      # connections. Without this, the app races the database on startup and
      # dies with "connection refused". pg_isready makes "up" mean "usable".
      test: ["CMD-SHELL", "pg_isready -U househunting -d househunting"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    # Comes back automatically after a reboot or Docker Desktop restart,
    # but stays down if you deliberately stopped it.
    restart: unless-stopped

volumes:
  db-data:
