spring:
  application:
    name: househunting

  # Defaults to dev locally; production overrides with SPRING_PROFILES_ACTIVE.
  # The dev profile is what activates DevDataSeeder — in production that bean
  # is never created at all, rather than created and then disabled by a flag
  # somebody could get wrong.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---- Database connection ------------------------------------------------
  # Every value has an env-var override with a local default. The same jar then
  # runs against the dev container and production with no code change and no
  # secret in the repository.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/househunting}
    username: ${DB_USERNAME:househunting}
    password: ${DB_PASSWORD:localdev}
    hikari:
      # Pool sizing is not "bigger is better". Each connection is a real
      # server-side process; past a point more connections make Postgres slower,
      # not faster. Ten is generous for a single app instance.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000   # fail in 10s rather than hang the request

  # ---- JPA / Hibernate ----------------------------------------------------
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only VERIFIES that our entities match
      # it, and refuses to start if they have drifted.
      #
      # Never `update` here: it silently alters schema, never drops anything,
      # cannot be reviewed or rolled back, and differs across Hibernate versions.
      ddl-auto: validate

    # Spring Boot defaults this to true. Left on, the Hibernate session stays
    # open through template rendering, so a lazy association touched inside a
    # Thymeleaf loop fires a query during HTML generation — which is exactly how
    # N+1 problems stay invisible. Off, every query must happen in the service
    # layer where it can be seen and measured.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Store and read timestamps in UTC regardless of the server's zone.
          # Formatting to IST is a presentation concern, handled at the edge.
          time_zone: UTC

  # ---- Schema migrations --------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Refuse to run against a non-empty database with no history table. Stops us
    # silently adopting some other project's schema.
    baseline-on-migrate: false

  # ---- Sessions -----------------------------------------------------------
  session:
    store-type: jdbc
    # Long, because this is a consumer app people return to over weeks, and
    # re-running an OTP costs a real SMS. Sessions are revocable server-side,
    # so a long lifetime is not the risk it would be with a JWT.
    timeout: 30d
    jdbc:
      # Flyway owns the schema (V6). Letting Spring Session create its own
      # tables would give the database two owners and no ordered history.
      initialize-schema: never

  # ---- Uploads ------------------------------------------------------------
  servlet:
    multipart:
      # Rejected by the container before a byte reaches our code, so an
      # oversized upload costs nothing. PhotoService enforces the same limit
      # again, because a limit only in configuration is a limit somebody can
      # change without noticing what depended on it.
      max-file-size: 12MB
      max-request-size: 60MB

  thymeleaf:
    # Fail at STARTUP if the template directory is missing, rather than throwing
    # a 500 the first time a user hits a page. Prefer loud and early.
    check-template-location: true

# ---- Application settings -------------------------------------------------
househunting:
  photos:
    # "local" writes under the directory below. Production will use an
    # S3-compatible bucket behind the same PhotoStorage interface, so nothing
    # above that interface changes.
    storage: ${HOUSEHUNTING_PHOTO_STORAGE:local}
    local-dir: ${HOUSEHUNTING_PHOTO_DIR:./data/photos}

    # Used only when storage=s3. Works with Amazon S3, Cloudflare R2,
    # DigitalOcean Spaces, Backblaze B2 and MinIO — they all speak this API.
    s3:
      bucket: ${HOUSEHUNTING_S3_BUCKET:}
      # Leave blank for Amazon S3 itself. Set it for everyone else, e.g.
      #   R2      https://<account>.r2.cloudflarestorage.com
      #   Spaces  https://blr1.digitaloceanspaces.com
      endpoint: ${HOUSEHUNTING_S3_ENDPOINT:}
      # "auto" for providers that have no regions but require the field.
      region: ${HOUSEHUNTING_S3_REGION:ap-south-1}
      access-key: ${HOUSEHUNTING_S3_ACCESS_KEY:}
      secret-key: ${HOUSEHUNTING_S3_SECRET_KEY:}

  mail:
    # "console" prints to the log; "smtp" actually sends. Every provider worth
    # using speaks SMTP, so switching is configuration rather than code.
    provider: ${HOUSEHUNTING_MAIL_PROVIDER:console}
    # MUST be an address the provider has verified for the sending domain. An
    # unverified From is rejected by SES and silently spam-foldered by others.
    from: ${HOUSEHUNTING_MAIL_FROM:NextTenant <noreply@invalid.invalid>}
    # People reply to notification emails. Send those somewhere a person reads.
    reply-to: ${HOUSEHUNTING_MAIL_REPLY_TO:}

  maps:
    # Google Maps JavaScript API key. Blank by default, which makes every map
    # fall back to Leaflet with OpenStreetMap tiles — so a fresh clone runs
    # with working maps and nothing to sign up for.
    #
    # To switch to Google:
    #   1. Cloud Console -> enable "Maps JavaScript API" on a project with
    #      billing attached. There is a monthly free allowance; past it, loads
    #      are charged.
    #   2. Create an API key.
    #   3. RESTRICT IT. Application restrictions -> HTTP referrers, listing
    #      http://localhost:8080/* and your real domain. API restrictions ->
    #      Maps JavaScript API only. The key is visible in the page source
    #      because the API runs in the browser; the referrer restriction, not
    #      secrecy, is what stops a copied key being usable elsewhere.
    #   4. Set GOOGLE_MAPS_API_KEY in the environment. Do not paste it here —
    #      this file is committed.
    google-api-key: ${GOOGLE_MAPS_API_KEY:}

  site:
    # Emails need an ABSOLUTE link; a browser knows where a relative path
    # came from and an inbox does not. Override per environment.
    base-url: ${HOUSEHUNTING_BASE_URL:http://localhost:8080}

  otp:
    # HMAC key for hashing codes. The default below is committed, therefore
    # public, therefore not a secret — OtpSecretCheck refuses to start with it
    # under any profile but dev. Generate a real one with:
    #     openssl rand -base64 48
    secret: ${HOUSEHUNTING_OTP_SECRET:dev-only-insecure-otp-secret-change-me}

    code-validity: 10m
    resend-cooldown: 30s

    # Six digits is a million guesses. The attempt cap, not the code length,
    # is what makes that safe.
    max-attempts: 5
    max-sends: 5

    # Two dimensions: per-number stops one person being spammed, per-IP stops
    # an attacker cycling numbers to run up the SMS bill.
    per-phone-per-hour: 5

    # Email is the live login channel and costs a fraction of an SMS, so this
    # is set by how many codes a confused person could plausibly need.
    per-email-per-hour: 10
    per-ip-per-hour: 20
    rate-window: 1h

server:
  port: 8080
  error:
    # Safe in development; turned off for production, where it leaks internals.
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.househunting: DEBUG
    # Flyway announces each migration it applies — worth seeing.
    org.flywaydb: INFO
    # Uncomment to see every SQL statement Hibernate issues. Invaluable when
    # hunting N+1 queries; far too noisy to leave on.
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE

# ---- Health check ---------------------------------------------------------
# One endpoint, and only one. The others (env, beans, configprops, heapdump)
# publish configuration and environment variables, which is how a deployment
# leaks its own database URL to anyone who guesses a URL.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # "UP" only when the database answers too. A health check that reports a
      # healthy JVM in front of an unreachable database keeps a broken instance
      # in the load balancer, which is worse than no health check at all.
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

    # OFF, deliberately, and this was found by actually booting with
    # provider=smtp: spring-boot-starter-mail registers a health indicator that
    # opens a real SMTP connection on EVERY health poll. Two things wrong with
    # leaving it on.
    #
    # It reports the whole application DOWN when the mail provider is
    # unreachable — so a load balancer pulls the site out of rotation because
    # email is having a bad minute, even though browsing, searching and
    # requesting all work perfectly without it. The health check would cause
    # the outage it is meant to detect.
    #
    # And polling every few seconds means an SMTP connection every few seconds,
    # which providers rate-limit and some count as usage.
    mail:
      enabled: false


# ===========================================================================
# PRODUCTION
#
# Active when SPRING_PROFILES_ACTIVE=prod. Everything secret comes from the
# environment; nothing secret is in this file, which is why this file can be
# committed.
#
# Note what is NOT here: DevDataSeeder. It is @Profile("dev"), so under prod
# the bean is never created at all, rather than created and disabled by a flag
# somebody could get wrong.
# ===========================================================================
---
spring:
  config:
    activate:
      on-profile: prod

  # Production mail. The host/port/credentials belong to Spring Boot's own
  # binding; only the addresses on the message are ours (househunting.mail.*).
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          # STARTTLS, not plaintext. Without it, credentials and message bodies
          # cross the network in the clear.
          starttls:
            enable: true
            required: true
          # Fail rather than hang. A blocked SMTP port is a common first-deploy
          # symptom, and an infinite wait looks like the whole app has frozen.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  error:
    # OFF. In development these turn a 500 into a readable message; in
    # production the same message hands a stranger the shape of the stack,
    # the SQL, and sometimes the values that were being processed.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  # Behind a load balancer or reverse proxy, so the app must trust the
  # X-Forwarded-* headers to know it is really on HTTPS. Without this, every
  # redirect it issues points at http:// and the browser downgrades.
  forward-headers-strategy: framework

logging:
  level:
    # INFO, not DEBUG. DEBUG here prints the OTP issuing path and a great deal
    # of Hibernate, into an aggregator readable by more people than an inbox.
    com.househunting: INFO
    root: WARN
