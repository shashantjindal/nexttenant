spring:
  application:
    name: nexttenant

  # Defaults to dev locally; production overrides with SPRING_PROFILES_ACTIVE.
  # The dev profile is what activates DevDataSeeder — in production that bean
  # is never created at all, rather than created and then disabled by a flag
  # somebody could get wrong.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # How long server.shutdown=graceful waits for in-flight requests before
  # giving up on them. Comfortably longer than any request this app serves and
  # comfortably shorter than the container's stop_grace_period in
  # docker-compose.prod.yml — if Docker's SIGKILL lands first, "graceful" is
  # just a slower version of dropping the connections.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # ---- Database connection ------------------------------------------------
  # Every value has an env-var override with a local default. The same jar then
  # runs against the dev container and production with no code change and no
  # secret in the repository.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexttenant}
    username: ${DB_USERNAME:nexttenant}
    password: ${DB_PASSWORD:localdev}
    hikari:
      # Pool sizing is not "bigger is better". Each connection is a real
      # server-side process; past a point more connections make Postgres slower,
      # not faster. Ten is generous for a single app instance.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000   # fail in 10s rather than hang the request

  # ---- JPA / Hibernate ----------------------------------------------------
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only VERIFIES that our entities match
      # it, and refuses to start if they have drifted.
      #
      # Never `update` here: it silently alters schema, never drops anything,
      # cannot be reviewed or rolled back, and differs across Hibernate versions.
      ddl-auto: validate

    # Spring Boot defaults this to true. Left on, the Hibernate session stays
    # open through template rendering, so a lazy association touched inside a
    # Thymeleaf loop fires a query during HTML generation — which is exactly how
    # N+1 problems stay invisible. Off, every query must happen in the service
    # layer where it can be seen and measured.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Store and read timestamps in UTC regardless of the server's zone.
          # Formatting to IST is a presentation concern, handled at the edge.
          time_zone: UTC

  # ---- Schema migrations --------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Refuse to run against a non-empty database with no history table. Stops us
    # silently adopting some other project's schema.
    baseline-on-migrate: false

  # ---- Sessions -----------------------------------------------------------
  session:
    store-type: jdbc
    # Long, because this is a consumer app people return to over weeks, and
    # re-running an OTP costs a real SMS. Sessions are revocable server-side,
    # so a long lifetime is not the risk it would be with a JWT.
    timeout: 30d
    jdbc:
      # Flyway owns the schema (V6). Letting Spring Session create its own
      # tables would give the database two owners and no ordered history.
      initialize-schema: never

  # ---- Uploads ------------------------------------------------------------
  servlet:
    multipart:
      # Rejected by the container before a byte reaches our code, so an
      # oversized upload costs nothing. PhotoService enforces the same limit
      # again, because a limit only in configuration is a limit somebody can
      # change without noticing what depended on it.
      max-file-size: 12MB
      max-request-size: 60MB

  thymeleaf:
    # Fail at STARTUP if the template directory is missing, rather than throwing
    # a 500 the first time a user hits a page. Prefer loud and early.
    check-template-location: true

# ---- Application settings -------------------------------------------------
nexttenant:
  photos:
    # "local" writes under the directory below. Production will use an
    # S3-compatible bucket behind the same PhotoStorage interface, so nothing
    # above that interface changes.
    storage: ${NEXTTENANT_PHOTO_STORAGE:local}
    local-dir: ${NEXTTENANT_PHOTO_DIR:./data/photos}

    # Used only when storage=s3. Works with Amazon S3, Cloudflare R2,
    # DigitalOcean Spaces, Backblaze B2 and MinIO — they all speak this API.
    s3:
      bucket: ${NEXTTENANT_S3_BUCKET:}
      # Leave blank for Amazon S3 itself. Set it for everyone else, e.g.
      #   R2      https://<account>.r2.cloudflarestorage.com
      #   Spaces  https://blr1.digitaloceanspaces.com
      endpoint: ${NEXTTENANT_S3_ENDPOINT:}
      # "auto" for providers that have no regions but require the field.
      region: ${NEXTTENANT_S3_REGION:ap-south-1}
      access-key: ${NEXTTENANT_S3_ACCESS_KEY:}
      secret-key: ${NEXTTENANT_S3_SECRET_KEY:}

  mail:
    # "console" prints to the log; "smtp" actually sends. Every provider worth
    # using speaks SMTP, so switching is configuration rather than code.
    provider: ${NEXTTENANT_MAIL_PROVIDER:console}
    # MUST be an address the provider has verified for the sending domain. An
    # unverified From is rejected by SES and silently spam-foldered by others.
    from: ${NEXTTENANT_MAIL_FROM:NextTenant <noreply@invalid.invalid>}
    # People reply to notification emails. Send those somewhere a person reads.
    reply-to: ${NEXTTENANT_MAIL_REPLY_TO:}

  maps:
    # Google Maps JavaScript API key. Blank by default, which makes every map
    # fall back to Leaflet with OpenStreetMap tiles — so a fresh clone runs
    # with working maps and nothing to sign up for.
    #
    # To switch to Google:
    #   1. Cloud Console -> enable "Maps JavaScript API" on a project with
    #      billing attached. There is a monthly free allowance; past it, loads
    #      are charged.
    #   2. Create an API key.
    #   3. RESTRICT IT. Application restrictions -> HTTP referrers, listing
    #      http://localhost:8080/* and your real domain. API restrictions ->
    #      Maps JavaScript API only. The key is visible in the page source
    #      because the API runs in the browser; the referrer restriction, not
    #      secrecy, is what stops a copied key being usable elsewhere.
    #   4. Set GOOGLE_MAPS_API_KEY in the environment. Do not paste it here —
    #      this file is committed.
    google-api-key: ${GOOGLE_MAPS_API_KEY:}

  # ---- Legal --------------------------------------------------------------
  # Named here rather than written into the privacy policy template, because
  # these two must be true of whoever is actually running the site. A fork or a
  # handover changes them, and a policy naming the wrong person is worse than
  # one naming nobody: it tells a reader their complaint went somewhere it did
  # not.
  #
  # The DPDP Act requires a NAMED grievance officer, not just an inbox. With
  # these unset the policy page says plainly that it is incomplete rather than
  # rendering a gap where a name belongs.
  legal:
    entity-name: ${NEXTTENANT_ENTITY_NAME:NextTenant}
    contact-email: ${NEXTTENANT_PRIVACY_EMAIL:}
    grievance-officer: ${NEXTTENANT_GRIEVANCE_OFFICER:}

  site:
    # Emails need an ABSOLUTE link; a browser knows where a relative path
    # came from and an inbox does not. Override per environment.
    #
    # Canonical tags and Open Graph URLs are built from this too, which raises
    # the stakes: a staging copy left pointing at the production host publishes
    # canonicals claiming to BE production, and a staging copy with its own host
    # and no robots rules competes with it. Set this per environment.
    base-url: ${NEXTTENANT_BASE_URL:http://localhost:8080}

  seo:
    # The value from Search Console's "HTML tag" verification method — just the
    # token, without the surrounding markup. Blank means the tag is not
    # rendered at all, which is an unattempted verification rather than a
    # failed one.
    search-console-token: ${NEXTTENANT_GSC_TOKEN:}

    # Privacy-respecting analytics: Plausible or Umami, self-hosted or theirs.
    # No cookies, no cross-site identifier, no personal data leaving the
    # country — which under the DPDP Act is the difference between analytics
    # you can simply run and analytics that need a consent banner in front of
    # them.
    #
    # DELIBERATELY NOT Google Analytics. GA sets identifiers and transfers
    # personal data abroad, so it would need opt-in consent before the script
    # loaded, and a banner costs more conversions than the numbers are worth at
    # this size. If that trade changes it should change in a conversation.
    #
    # Both must be set or analytics stays off: a script URL with no domain
    # loads a tracker that reports nothing, which is a third-party request on
    # every page view bought for no data.
    analytics-script-url: ${NEXTTENANT_ANALYTICS_SCRIPT:}
    analytics-domain: ${NEXTTENANT_ANALYTICS_DOMAIN:}

  otp:
    # HMAC key for hashing codes. The default below is committed, therefore
    # public, therefore not a secret — OtpSecretCheck refuses to start with it
    # under any profile but dev. Generate a real one with:
    #     openssl rand -base64 48
    secret: ${NEXTTENANT_OTP_SECRET:dev-only-insecure-otp-secret-change-me}

    code-validity: 10m
    resend-cooldown: 30s

    # Six digits is a million guesses. The attempt cap, not the code length,
    # is what makes that safe.
    max-attempts: 5
    max-sends: 5

    # Two dimensions: per-number stops one person being spammed, per-IP stops
    # an attacker cycling numbers to run up the SMS bill.
    per-phone-per-hour: 5

    # Email is the live login channel and costs a fraction of an SMS, so this
    # is set by how many codes a confused person could plausibly need.
    per-email-per-hour: 10
    per-ip-per-hour: 20
    rate-window: 1h

server:
  port: 8080

  # gzip on the way out. Measured with Lighthouse against a real area page:
  # 102KB of the ~120KB transferred was compressible text, most of it app.css.
  #
  # Caddy also compresses in production, so this is belt and braces there — but
  # it is NOT redundant: it covers anything reaching the app directly, and it
  # means a development run and a deployed one behave the same way. A
  # performance fix that only exists in production is one nobody can measure.
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,text/xml,application/javascript,application/json,application/xml
    # Below about a kilobyte, the header and CPU cost more than the saving.
    min-response-size: 1024

  # On SIGTERM, stop accepting new requests and let the ones already running
  # finish instead of cutting the connections. Spring Boot's default is
  # immediate: every deploy drops whatever was in flight, which for somebody
  # mid-upload is a failed listing they have to start again.
  #
  # Also what makes readiness useful — graceful shutdown flips the readiness
  # probe to OUT_OF_SERVICE first, so the proxy can take this container out of
  # rotation while it drains.
  shutdown: graceful

  error:
    # Safe in development; turned off for production, where it leaks internals.
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.nexttenant: DEBUG
    # Flyway announces each migration it applies — worth seeing.
    org.flywaydb: INFO
    # Uncomment to see every SQL statement Hibernate issues. Invaluable when
    # hunting N+1 queries; far too noisy to leave on.
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE

# ---- Health check ---------------------------------------------------------
# Health is public; everything else here is behind ROLE_ADMIN, enforced in
# SecurityConfig rather than by obscurity.
#
# What is NOT exposed matters more than what is. `env` and `configprops` print
# resolved configuration - including the database password and the OTP secret -
# and `heapdump` hands over a file containing whatever was in memory. Being
# behind an admin login is not sufficient reason to publish a credential over
# HTTP, so those three stay off whatever the login says.
management:
  endpoints:
    web:
      exposure:
        # health       liveness, and whether the database answers
        # info         build version and time, for "what is actually deployed"
        # metrics      memory, CPU, HTTP timings, connection pool
        # loggers      READ and CHANGE log levels at runtime - the one that
        #              saves a redeploy when production misbehaves quietly
        # threaddump   what every thread is doing, for when it hangs
        include: health,info,metrics,loggers,threaddump
  info:
    env:
      enabled: true
  endpoint:
    health:
      # "UP" only when the database answers too. A health check that reports a
      # healthy JVM in front of an unreachable database keeps a broken instance
      # in the load balancer, which is worse than no health check at all.
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

    # OFF, deliberately, and this was found by actually booting with
    # provider=smtp: spring-boot-starter-mail registers a health indicator that
    # opens a real SMTP connection on EVERY health poll. Two things wrong with
    # leaving it on.
    #
    # It reports the whole application DOWN when the mail provider is
    # unreachable — so a load balancer pulls the site out of rotation because
    # email is having a bad minute, even though browsing, searching and
    # requesting all work perfectly without it. The health check would cause
    # the outage it is meant to detect.
    #
    # And polling every few seconds means an SMTP connection every few seconds,
    # which providers rate-limit and some count as usage.
    mail:
      enabled: false


# ===========================================================================
# PRODUCTION
#
# Active when SPRING_PROFILES_ACTIVE=prod. Everything secret comes from the
# environment; nothing secret is in this file, which is why this file can be
# committed.
#
# Note what is NOT here: DevDataSeeder. It is @Profile("dev"), so under prod
# the bean is never created at all, rather than created and disabled by a flag
# somebody could get wrong.
# ===========================================================================
---
spring:
  config:
    activate:
      on-profile: prod

  # Production mail. The host/port/credentials belong to Spring Boot's own
  # binding; only the addresses on the message are ours (nexttenant.mail.*).
  #
  # Every one of these has an EMPTY default, which looks careless and is not.
  # Written as ${SMTP_HOST} with no default, an unset variable is an unresolved
  # placeholder, and Spring refuses to start — even when
  # nexttenant.mail.provider is "console" and nothing will ever read it.
  #
  # That turns a legitimate state into a dead end: deploying before the mail
  # provider is ready, with codes printed to the log, is exactly what you want
  # on the first deployment of a site whose email verification is still being
  # approved. Blocking startup for want of a host nothing uses is the
  # configuration refusing a valid deployment.
  #
  # With provider=smtp and a blank host, sending fails at the first send, in
  # the logs, naming the problem — which is where that failure belongs. The
  # deployment checklist catches it: it has you send a real code to a real
  # inbox before telling anybody the site exists.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # STARTTLS, not plaintext. Without it, credentials and message bodies
          # cross the network in the clear.
          starttls:
            enable: true
            required: true
          # Fail rather than hang. A blocked SMTP port is a common first-deploy
          # symptom, and an infinite wait looks like the whole app has frozen.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  error:
    # OFF. In development these turn a 500 into a readable message; in
    # production the same message hands a stranger the shape of the stack,
    # the SQL, and sometimes the values that were being processed.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  # Behind a load balancer or reverse proxy, so the app must trust the
  # X-Forwarded-* headers to know it is really on HTTPS. Without this, every
  # redirect it issues points at http:// and the browser downgrades.
  forward-headers-strategy: framework

logging:
  level:
    # INFO, not DEBUG. DEBUG here prints the OTP issuing path and a great deal
    # of Hibernate, into an aggregator readable by more people than an inbox.
    com.nexttenant: INFO
    root: WARN
