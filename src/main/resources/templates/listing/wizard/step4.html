<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Handover terms — NextTenant</title></head>
<body>

<main id="content" class="page-width wizard">
    <div th:replace="~{listing/wizard/_shell :: head(${step}, ${totalSteps},
                       'Handover terms',
                       'The things that usually take a week of messages to find out.')}"></div>

    <form method="post" th:action="@{/list/{id}/4(id=${draft.id})}" class="wizard__form">

        <fieldset class="wizard__group">
            <legend>Owner and deposit</legend>

            <label class="field">
                <span class="field__label">Does the owner know this room is changing hands?</span>
                <select name="ownerInformed">
                    <option value="">Not sure</option>
                    <option value="true" th:selected="${draft.ownerInformed == true}">Yes</option>
                    <option value="false" th:selected="${draft.ownerInformed == false}">Not yet</option>
                </select>
                <small class="wizard__hint">
                    Takeovers the owner has not agreed to fall through most often.
                </small>
            </label>

            <label class="field">
                <span class="field__label">Who holds the deposit today?</span>
                <select name="depositPaidTo">
                    <option value="">Choose</option>
                    <option th:each="d : ${depositPaidToOptions}" th:value="${d}" th:text="${d.label}"
                            th:selected="${d == draft.depositPaidTo}">Paid to the owner</option>
                </select>
                <small class="wizard__hint">
                    Whoever holds it is who returns it, which decides who the taker pays.
                </small>
            </label>
        </fieldset>

        <fieldset class="wizard__group">
            <legend>The agreement</legend>

            <label class="field">
                <span class="field__label">Is the agreement registered?</span>
                <select name="registeredAgreement">
                    <option value="">Not sure</option>
                    <option value="true" th:selected="${draft.registeredAgreement == true}">Yes</option>
                    <option value="false" th:selected="${draft.registeredAgreement == false}">No</option>
                </select>
                <small class="wizard__hint">
                    A registered agreement is enforceable. An unregistered one is far weaker.
                </small>
            </label>

            <label class="field">
                <span class="field__label">How does the paperwork transfer?</span>
                <select name="agreementHandling">
                    <option value="">Choose</option>
                    <option th:each="a : ${agreementOptions}" th:value="${a}" th:text="${a.label}"
                            th:selected="${a == draft.agreementHandling}">Existing agreement transfers</option>
                </select>
            </label>
        </fieldset>

        <fieldset class="wizard__group">
            <legend>Notice and who can take it</legend>

            <label class="field">
                <span class="field__label">Notice period left (days)</span>
                <input type="number" name="noticePeriodDays" min="0" max="365"
                       inputmode="numeric" th:value="${draft.noticePeriodDays}">
            </label>

            <label class="field">
                <span class="field__label">Does the society allow bachelors?</span>
                <select name="bachelorsAllowed">
                    <option value="">Not sure</option>
                    <option value="true" th:selected="${draft.bachelorsAllowed == true}">Yes</option>
                    <option value="false" th:selected="${draft.bachelorsAllowed == false}">No</option>
                </select>
                <small class="wizard__hint">
                    Some societies restrict this regardless of who the flatmates are.
                </small>
            </label>
        </fieldset>

        <div th:replace="~{listing/wizard/_shell :: nav(${draft}, ${step})}"></div>
    </form>
</main>

</body>
</html>
