<!DOCTYPE html>
<!--/*
  Screen two of two: photos and money.

  Photos come FIRST on this screen and not last in the flow, which is the
  single biggest ordering change. They are the highest-effort thing asked for
  and they are required, and they used to be screen six of six — so somebody
  answered thirty-odd questions and then hit a wall needing three photos they
  did not have to hand. Everything saved; nothing published. The dashboard
  filled up with listings stopped at "step 6 of 6".

  The photo forms sit OUTSIDE the money form. Two separate submissions: photos
  go the moment they are chosen, the money posts when the person is done.
  Nesting forms is invalid HTML and browsers resolve it by discarding one.

  The fields are in _fields.html, shared with the admin flow. See step1.html.
*/-->
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Photos and money — NextTenant</title></head>
<body>

<main id="content" class="page-width wizard">
    <div th:replace="~{listing/wizard/_shell :: head(${step}, ${totalSteps},
                       'Photos and money',
                       'Three photos minimum. Rooms with photos get several times more requests.')}"></div>

    <th:block th:replace="~{listing/wizard/_fields :: photos}"></th:block>

    <form method="post" th:action="@{/list/{id}/2(id=${draft.id})}" class="wizard__form">
        <th:block th:replace="~{listing/wizard/_fields :: money}"></th:block>
        <div th:replace="~{listing/wizard/_shell :: nav(${draft}, ${step})}"></div>
    </form>
</main>

</body>
</html>
