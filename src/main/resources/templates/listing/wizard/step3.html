<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>The money — NextTenant</title></head>
<body>

<main id="content" class="page-width wizard">
    <div th:replace="~{listing/wizard/_shell :: head(${step}, ${totalSteps},
                       'The money',
                       'Hidden costs are the biggest reason a takeover falls apart at the door.')}"></div>

    <form method="post" th:action="@{/list/{id}/3(id=${draft.id})}" class="wizard__form">

        <fieldset class="wizard__group">
            <legend>Rent and deposit</legend>

            <label class="field">
                <span class="field__label">Monthly rent for this room</span>
                <div class="field__money">
                    <span class="field__prefix">&#8377;</span>
                    <input type="text" name="monthlyRent" inputmode="numeric"
                           data-digits pattern="[0-9,]*"
                           th:value="${draft.monthlyRentInr}" placeholder="32000" required>
                </div>
            </label>

            <label class="field">
                <span class="field__label">Security deposit</span>
                <div class="field__money">
                    <span class="field__prefix">&#8377;</span>
                    <input type="text" name="deposit" inputmode="numeric"
                           data-digits pattern="[0-9,]*"
                           th:value="${draft.depositInr}" placeholder="64000" required>
                </div>
            </label>
        </fieldset>

        <fieldset class="wizard__group">
            <legend>Maintenance, brokerage and buy-out</legend>

            <label class="field">
                <span class="field__label">Society maintenance</span>
                <div class="field__money">
                    <span class="field__prefix">&#8377;</span>
                    <input type="text" name="maintenance" inputmode="numeric"
                           data-digits pattern="[0-9,]*"
                           th:value="${draft.maintenanceInr}" placeholder="2500">
                </div>
            </label>

            <label class="check">
                <input type="checkbox" name="maintenanceIncluded" value="true"
                       th:checked="${draft.maintenanceIncluded}">
                <span>Already included in the rent above</span>
            </label>

            <label class="field">
                <span class="field__label">Brokerage you are asking for</span>
                <div class="field__money">
                    <span class="field__prefix">&#8377;</span>
                    <input type="text" name="brokerage" inputmode="numeric"
                           data-digits pattern="[0-9,]*"
                           th:value="${draft.brokerageInr}" placeholder="0">
                </div>
                <!--/* Not a rule, a nudge. The product's claim is that these
                       takeovers are broker-free; making that explicit here is
                       more honest than silently forbidding a number. */-->
                <small class="wizard__hint">
                    Listings with zero brokerage carry the badge and get far more
                    requests. This is a takeover, not a brokerage.
                </small>
            </label>

            <label class="field">
                <span class="field__label">Buy-out for what you leave behind</span>
                <div class="field__money">
                    <span class="field__prefix">&#8377;</span>
                    <input type="text" name="buyout" inputmode="numeric"
                           data-digits pattern="[0-9,]*"
                           th:value="${draft.buyoutInr}" placeholder="0">
                </div>
                <small class="wizard__hint">
                    Furniture, appliances, curtains — whatever you are selling on.
                </small>
            </label>
        </fieldset>

        <div th:replace="~{listing/wizard/_shell :: nav(${draft}, ${step})}"></div>
    </form>
</main>

</body>
</html>
