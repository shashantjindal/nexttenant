<!DOCTYPE html>
<!--/*
  Screen one of two: the eight things a room cannot be listed without.

  The fields themselves moved to _fields.html when a second screen started
  asking for them — an operator filling in a listing for somebody at
  /admin/listings/{id}/2. What is left here is what is genuinely particular to
  this door: the title, the lede, and where the form posts.

  That is the right seam. Two copies of the markup would agree today and
  disagree the first time a field is added to one of them, and nothing would
  fail — the two screens would simply stop asking the same questions.
*/-->
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>About the room — NextTenant</title></head>
<body>

<main id="content" class="page-width wizard">
    <div th:replace="~{listing/wizard/_shell :: head(${step}, ${totalSteps},
                       'About the room',
                       'Eight quick answers. The rest is optional and comes later.')}"></div>

    <form method="post" th:action="@{/list/{id}/1(id=${draft.id})}" class="wizard__form">
        <th:block th:replace="~{listing/wizard/_fields :: basics}"></th:block>
        <div th:replace="~{listing/wizard/_shell :: nav(${draft}, ${step})}"></div>
    </form>

    <!--/* Inside <main>, because the layout fragment renders only the title
           and this element; a script anywhere else is dropped. */-->
    <script th:src="@{/js/area-picker.js}" src="/js/area-picker.js" defer></script>
</main>

</body>
</html>
