<!DOCTYPE html>
<!--/*
  Screen one of two: the eight things a room cannot be listed without.

  Everything here is a radio rendered as a button. The old screens used native
  <select>s, which on a phone open a scroll wheel — a two-tap interaction with
  the options hidden until you commit to looking. Buttons show every choice at
  once and take one tap, and when there are only three or four options there is
  no reason to hide them.

  Radios, not <div>s with click handlers: keyboard navigation, screen reader
  grouping and "one of these" semantics all come free, and the form still works
  with no JavaScript at all.
*/-->
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>About the room — NextTenant</title></head>
<body>

<main id="content" class="page-width wizard">
    <div th:replace="~{listing/wizard/_shell :: head(${step}, ${totalSteps},
                       'About the room',
                       'Eight quick answers. The rest is optional and comes later.')}"></div>

    <form method="post" th:action="@{/list/{id}/1(id=${draft.id})}" class="wizard__form">

        <!-- ================= Where ================= -->
        <fieldset class="wizard__group">
            <legend>Where it is</legend>

            <!--/*
              A search box over a 200-option list, not the list itself. Finding
              "Powai" by scrolling every locality in Mumbai on a phone was the
              first thing this screen asked anybody to do.

              The <select> underneath stays, and that is deliberate: it is what
              posts the value, what a keyboard user can drive, and what works
              when the script does not load. area-picker.js hides it and drives
              it from the box above.
            */-->
            <label class="field" data-area-picker>
                <span class="field__label">Area</span>
                <input type="search" class="area-picker__input" autocomplete="off"
                       placeholder="Start typing — Powai, Bandra, Andheri…"
                       aria-label="Search for an area">
                <select name="areaName" required class="area-picker__select">
                    <option value="">Choose an area</option>
                    <th:block th:each="group : ${areaGroups}">
                        <th:block th:if="${group.hasChildren()}">
                            <optgroup th:label="${group.parent.name}">
                                <option th:value="${group.parent.name}"
                                        th:text="'All of ' + ${group.parent.name}"
                                        th:selected="${group.parent.name == draft.areaName}">All</option>
                                <option th:each="child : ${group.children}"
                                        th:value="${child.name}" th:text="${child.name}"
                                        th:selected="${child.name == draft.areaName}">Child</option>
                            </optgroup>
                        </th:block>
                        <option th:unless="${group.hasChildren()}"
                                th:value="${group.parent.name}"
                                th:text="${group.parent.name} + ' · ' + ${group.parent.nearestStation} + ' station'"
                                th:selected="${group.parent.name == draft.areaName}">Area</option>
                    </th:block>
                </select>
                <!--/* The station is no longer asked for — every area already
                       knows its own, and it is the most useful single fact
                       about a Mumbai address. The question went; the answer
                       did not. */-->
                <small class="wizard__hint">
                    We work out the nearest station from this, and place your
                    listing in the area. No pin needed.
                </small>
            </label>
        </fieldset>

        <!-- ================= The flat ================= -->
        <fieldset class="wizard__group">
            <legend>The flat</legend>

            <div class="field">
                <span class="field__label">Size</span>
                <div class="choice-row">
                    <label class="choice" th:each="c : ${configurations}">
                        <input type="radio" name="configuration" th:value="${c}" required
                               th:checked="${c == draft.configuration}">
                        <span th:text="${c.label}">2 BHK</span>
                    </label>
                </div>
            </div>

            <div class="field">
                <span class="field__label">What you are handing over</span>
                <div class="choice-row">
                    <label class="choice" th:each="r : ${roomTypes}">
                        <input type="radio" name="roomType" th:value="${r}" required
                               th:checked="${r == draft.roomType}">
                        <span th:text="${r.label}">Private room</span>
                    </label>
                </div>
            </div>

            <div class="field">
                <span class="field__label">Furnishing</span>
                <div class="choice-row">
                    <label class="choice" th:each="f : ${furnishings}">
                        <input type="radio" name="furnishing" th:value="${f}" required
                               th:checked="${f == draft.furnishing}">
                        <span th:text="${f.label}">Semi-furnished</span>
                    </label>
                </div>
            </div>

            <div class="field">
                <span class="field__label">Building</span>
                <div class="choice-row">
                    <label class="choice" th:each="t : ${flatTypes}">
                        <input type="radio" name="flatType" th:value="${t}" required
                               th:checked="${t == draft.flatType}">
                        <span th:text="${t.label}">Gated society</span>
                    </label>
                </div>
                <!--/* Asked because people ask before agreeing to visit: it
                       decides whether a watchman logs guests and what hours
                       they may come. */-->
            </div>
        </fieldset>

        <!-- ================= Who and when ================= -->
        <fieldset class="wizard__group">
            <legend>Who and when</legend>

            <div class="field">
                <span class="field__label">Who can take this room</span>
                <div class="choice-row">
                    <label class="choice" th:each="g : ${genders}">
                        <input type="radio" name="flatmateGender" th:value="${g}" required
                               th:checked="${g == draft.flatmateGender}">
                        <span th:text="${g.label}">Anyone</span>
                    </label>
                </div>
            </div>

            <label class="field">
                <span class="field__label">Available from</span>
                <input type="date" name="availableFrom" required
                       th:min="${earliestMoveIn}"
                       th:value="${draft.availableFrom}">
            </label>

            <label class="field">
                <span class="field__label">
                    Flatmates staying on after you leave
                    <span class="field__optional">optional</span>
                </span>
                <input type="text" name="existingFlatmates" inputmode="numeric"
                       data-digits pattern="[0-9]*" maxlength="2"
                       th:value="${draft.existingFlatmates}" placeholder="2">
            </label>
        </fieldset>

        <div th:replace="~{listing/wizard/_shell :: nav(${draft}, ${step})}"></div>
    </form>

    <!--/* Inside <main>, because the layout fragment renders only the title
           and this element; a script anywhere else is dropped. */-->
    <script th:src="@{/js/area-picker.js}" src="/js/area-picker.js" defer></script>
</main>

</body>
</html>
