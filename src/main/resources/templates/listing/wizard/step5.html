<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Flatmates and house rules — NextTenant</title></head>
<body>

<main id="content" class="page-width wizard">
    <div th:replace="~{listing/wizard/_shell :: head(${step}, ${totalSteps},
                       'Flatmates and house rules',
                       'Say it plainly here and nobody wastes a visit finding out later.')}"></div>

    <form method="post" th:action="@{/list/{id}/5(id=${draft.id})}" class="wizard__form">

        <fieldset class="wizard__group">
            <legend>When can someone move in</legend>

            <label class="field">
                <span class="field__label">Available from</span>
                <!--/*
                  min stops the picker offering a date that has already gone.
                  "Available from 3 August" read in October is not a date, it
                  is a sign nobody has touched the listing in months — and
                  since searchers filter on it, a stale one quietly drops the
                  room out of results it belongs in.

                  The server checks the same thing, because min is a hint the
                  browser may ignore and a form can be posted without one.
                */-->
                <input type="date" name="availableFrom" required
                       th:min="${earliestMoveIn}"
                       th:value="${draft.availableFrom}">
            </label>
        </fieldset>

        <fieldset class="wizard__group">
            <legend>The flatmates</legend>

            <label class="field">
                <span class="field__label">What they do</span>
                <input type="text" name="flatmateProfessions" maxlength="160"
                       th:value="${draft.flatmateProfessions}"
                       placeholder="Working professionals">
            </label>

            <label class="field">
                <span class="field__label">Who can take this room</span>
                <select name="flatmateGender">
                    <option value="">Choose</option>
                    <option th:each="g : ${genders}" th:value="${g}" th:text="${g.label}"
                            th:selected="${g == draft.flatmateGender}">Anyone</option>
                </select>
            </label>
        </fieldset>

        <fieldset class="wizard__group">
            <legend>House rules</legend>

            <label class="field">
                <span class="field__label">Non-veg cooking</span>
                <select name="nonVegAllowed">
                    <option value="">Not stated</option>
                    <option value="true" th:selected="${draft.nonVegAllowed == true}">Allowed</option>
                    <option value="false" th:selected="${draft.nonVegAllowed == false}">Not allowed</option>
                </select>
            </label>

            <label class="field">
                <span class="field__label">Pets</span>
                <select name="petsAllowed">
                    <option value="">Not stated</option>
                    <option value="true" th:selected="${draft.petsAllowed == true}">Allowed</option>
                    <option value="false" th:selected="${draft.petsAllowed == false}">Not allowed</option>
                </select>
            </label>

            <label class="field">
                <span class="field__label">Smoking</span>
                <select name="smokingAllowed">
                    <option value="">Not stated</option>
                    <option value="true" th:selected="${draft.smokingAllowed == true}">Allowed</option>
                    <option value="false" th:selected="${draft.smokingAllowed == false}">Not allowed</option>
                </select>
            </label>

            <label class="field">
                <span class="field__label">Overnight guests</span>
                <select name="guestsAllowed">
                    <option value="">Not stated</option>
                    <option value="true" th:selected="${draft.guestsAllowed == true}">Allowed</option>
                    <option value="false" th:selected="${draft.guestsAllowed == false}">Not allowed</option>
                </select>
            </label>

            <label class="field">
                <span class="field__label">Anything else worth saying</span>
                <textarea name="houseRulesNote" rows="3" maxlength="1000"
                          th:text="${draft.houseRulesNote}"
                          placeholder="Quiet after 11, we split the cleaning"></textarea>
            </label>
        </fieldset>

        <div th:replace="~{listing/wizard/_shell :: nav(${draft}, ${step})}"></div>
    </form>
</main>

</body>
</html>
