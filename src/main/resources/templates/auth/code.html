<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Enter your code — HouseHunting</title></head>
<body>
<main id="content" class="page-width auth">
    <div class="auth__card">
        <h1 class="auth__title">Enter the code</h1>
        <p class="auth__sub">
            Sent to <strong th:text="${maskedPhone}">+91 ***** 43210</strong>
        </p>


        <form th:action="@{/login/code}" method="post" class="auth__form">
            <label class="field">
                <span class="sr-only">Six-digit code</span>
                <!--/*
                  One input rather than the six boxes in the prototype, because
                  autocomplete="one-time-code" is what makes iOS and Android
                  offer the code from the SMS above the keyboard. Six separate
                  inputs break that autofill, which costs far more in real use
                  than the boxes gain in looks.
                */-->
                <input type="text"
                       name="code"
                       class="field__otp"
                       inputmode="numeric"
                       autocomplete="one-time-code"
                       pattern="[0-9]{6}"
                       maxlength="6"
                       placeholder="······"
                       required
                       autofocus>
            </label>

            <button type="submit" class="btn btn--primary btn--block">Verify</button>
        </form>

        <div class="auth__actions">
            <form th:action="@{/login/resend}" method="post">
                <button type="submit" class="btn btn--ghost">Resend code</button>
            </form>
            <a class="btn btn--ghost" th:href="@{/login}">Change number</a>
        </div>

        <p class="auth__fine">
            The code expires in 10 minutes. Five wrong attempts and you start again.
        </p>
    </div>
</main>
</body>
</html>
