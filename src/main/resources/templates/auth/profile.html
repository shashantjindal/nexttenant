<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Your details — NextTenant</title></head>
<body>
<main id="content" class="page-width auth">
    <div class="auth__card">
        <h1 class="auth__title">A few details</h1>
        <p class="auth__sub">
            Only your first name is ever shown to other people.
        </p>


        <form th:action="@{/login/profile}" method="post" class="auth__form">
            <label class="field">
                <span class="field__label">First name</span>
                <input type="text" name="firstName" maxlength="40"
                       th:value="${firstName}"
                       autocomplete="given-name" required autofocus>
            </label>

            <!--/*
              The number is asked for HERE rather than on the login screen, so
              a returning visitor types one field to sign in and never sees
              this page again.

              It is required, because the entire product is two people ending
              up in one WhatsApp conversation — an account without a number
              cannot take part in that, and collecting it later would mean
              building a second prompt for the same fact.
            */-->
            <label class="field">
                <span class="field__label">Mobile number</span>
                <div class="field__phone">
                    <span class="field__prefix">+91</span>
                    <input type="tel"
                           name="phone"
                           th:value="${phone}"
                           inputmode="numeric"
                           autocomplete="tel-national"
                           maxlength="15"
                           placeholder="98765 43210"
                           required>
                </div>
                <span class="field__hint">
                    Shown only to someone whose request you have accepted.
                    Never on a listing, never to a stranger.
                </span>
            </label>

            <label class="field">
                <span class="field__label">Gender</span>
                <select name="gender">
                    <option value="">Prefer not to say</option>
                    <option th:each="g : ${genders}"
                            th:value="${g}"
                            th:text="${g.name().charAt(0) + g.name().substring(1).toLowerCase()}">Male</option>
                </select>
            </label>

            <label class="field">
                <span class="field__label">Age</span>
                <select name="ageBracket">
                    <option value="">Prefer not to say</option>
                    <option th:each="a : ${ageBrackets}"
                            th:value="${a}"
                            th:text="${#strings.replace(#strings.replace(a.name(), 'AGE_', ''), '_', '–')}">23–27</option>
                </select>
            </label>

            <button type="submit" class="btn btn--primary btn--block">Continue</button>
        </form>

        <p class="auth__fine">
            We never ask for documents or ID uploads.
        </p>
    </div>
</main>
</body>
</html>
