<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
      lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Log in — HouseHunting</title></head>
<body>
<main id="content" class="page-width auth">
    <div class="auth__card">
        <h1 class="auth__title">Log in or sign up</h1>
        <p class="auth__sub">
            One OTP-verified Indian number per account. No passwords, ever.
        </p>

        <p class="auth__error" th:if="${error}" th:text="${error}" role="alert">error</p>

        <!--/*
          Thymeleaf adds the CSRF hidden field to every <form method="post">
          automatically. Without it Spring rejects the request, which is the
          protection working: an attacker's page can submit a form to our
          server but cannot read the token out of our HTML.
        */-->
        <form th:action="@{/login/phone}" method="post" class="auth__form">
            <label class="field">
                <span class="field__label">Mobile number</span>
                <div class="field__phone">
                    <span class="field__prefix">+91</span>
                    <input type="tel"
                           name="phone"
                           th:value="${phone}"
                           inputmode="numeric"
                           autocomplete="tel-national"
                           maxlength="15"
                           placeholder="98765 43210"
                           required
                           autofocus>
                </div>
            </label>

            <button type="submit" class="btn btn--primary btn--block">Send OTP</button>
        </form>

        <p class="auth__fine">
            We send one message with a six-digit code. Standard SMS rates apply.
        </p>
    </div>
</main>
</body>
</html>
