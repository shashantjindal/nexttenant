<!DOCTYPE html>
<!--/*
  The site shell. Pages pass their own <title> and <main> into it:

      <html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">

  `~{::main}` is a fragment expression meaning "the <main> element of the page
  doing the replacing". The page references the layout rather than the layout
  enumerating pages, so each page stays a complete, openable HTML file.
*/-->
<html th:fragment="layout(title, content)" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--/* Replaced by the page's own <title>. */-->
    <title th:replace="${title}">NextTenant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Source+Sans+3:wght@400;500;600&amp;display=swap">

    <link rel="stylesheet" th:href="@{/css/tokens.css}" href="/css/tokens.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<!--/* data-wishlist-page is present only on /shortlist. shortlist.js uses it
       to drop a card when its heart is cleared, because on that page an
       unsaved room no longer belongs. Set from the model rather than sniffed
       from location.pathname in JavaScript, so the route lives in one place.
       th:attr removes the attribute entirely when the value is null. */-->
<body th:attr="data-wishlist-page=${wishlistPage}">

<!--/* Keyboard users land here first; lets them jump past the nav. */-->
<a class="skip-link" href="#content">Skip to content</a>

<header class="site-header">
    <div class="site-header__inner">
        <a class="wordmark" th:href="@{/}" href="/">NextTenant</a>

        <nav class="site-nav" aria-label="Main">
            <a th:href="@{/flats}" href="/flats">Find a flat</a>
            <a th:href="@{/list}" href="/list">List your flat</a>
        </nav>

        <div class="site-header__actions">
            <!--/* The wishlist gets its own header button rather than living
                   inside the dashboard. Saving a room is the single most
                   common thing anyone does here, and something people do
                   before they are ready to do anything else — burying the
                   place those saves land behind another page makes the heart
                   feel like it did nothing. */-->
            <a class="btn btn--ghost site-header__wishlist" th:if="${currentUser != null}"
               th:href="@{/shortlist}" title="Your wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 21s-7.5-4.6-9.6-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.6 12c-2.1 4.4-9.6 9-9.6 9z"/>
                </svg>
                <span class="site-header__label">Wishlist</span>
                <!--/* Updated in place by shortlist.js after a heart is
                       toggled, so the count never disagrees with what the
                       hearts on the page are showing. */-->
                <span class="site-header__count" data-wishlist-count
                      th:hidden="${counts.wishlist} == 0"
                      th:text="${counts.hasWishlist()} ? ${counts.wishlist} : ''">3</span>
            </a>

            <!--/* The pending badge is styled differently from the wishlist
                   one, and deliberately. A wishlist count is information:
                   nothing happens if you ignore it. A pending request is a
                   person waiting on an answer, and the thing that kills a
                   marketplace like this is requests sitting unanswered until
                   both sides give up. Two counts that looked identical would
                   say those are the same kind of number. */-->
            <a class="btn btn--ghost site-header__requests" th:if="${currentUser != null}"
               th:href="@{/requests}"
               th:attr="title=${counts.hasRequestsBadge()}
                        ? ${counts.requestsBadge()} + ' to look at'
                        : 'Requests'">
                <!--/* An icon so the word can drop away on a phone, exactly
                       as the wishlist heart does. Without one, hiding the
                       label would leave a bare number meaning nothing — and
                       keeping the label costs 113px of a 197px row, which is
                       what squeezed the signed-in name down to an ellipsis. */-->
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 13h4l2 3h6l2-3h4"/>
                    <path d="M4.5 6.5h15l1.5 6.5v4a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17v-4z"/>
                </svg>
                <span class="site-header__label">Requests</span>
                <span class="site-header__count site-header__count--waiting"
                      th:hidden="${counts.requestsBadge()} == 0"
                      th:text="${counts.hasRequestsBadge()} ? ${counts.requestsBadge()} : ''">2</span>
            </a>
            <a class="btn btn--ghost" th:if="${currentUser == null}"
               th:href="@{/login}" href="/login">Log in</a>
            <a class="btn btn--ghost" th:if="${currentUser != null}"
               th:href="@{/dashboard}"
               th:text="${currentUser.firstName() != null ? currentUser.firstName() : 'Dashboard'}">Dashboard</a>
        </div>
    </div>
</header>

<!--/*
  Toasts.

  Every page used to carry its own <p class="auth__error"> near the top of its
  <main>. Fourteen copies of the same two lines, each able to drift, and on a
  long page the message sat above the fold while the button that produced it
  was three screens down — so an action could be refused and look as though
  nothing had happened at all.

  One region in the layout, fed by the same `error` and `notice` model
  attributes as before. Controllers did not change: RedirectAttributes flash
  attributes land in the model, which is where this reads them.

  Two deliberate differences between the two kinds:

    role="alert" vs role="status" — alert interrupts a screen reader, status
    waits for a pause. An error is worth interrupting for; "Request sent" is
    not.

    Errors do NOT auto-dismiss. A confirmation can disappear, because if it is
    missed nothing is lost. An error that vanishes after four seconds is an
    error somebody will never find out about, and they will retry the action
    that failed.
*/-->
<div class="toasts" id="toasts">
    <div class="toast toast--error" th:if="${error}" role="alert">
        <span class="toast__icon" aria-hidden="true">!</span>
        <p class="toast__text" th:text="${error}">Something went wrong</p>
        <button type="button" class="toast__close" data-toast-close aria-label="Dismiss">&times;</button>
    </div>

    <div class="toast toast--notice" th:if="${notice}" role="status" data-toast-auto>
        <span class="toast__icon" aria-hidden="true">&#10003;</span>
        <p class="toast__text" th:text="${notice}">Done</p>
        <button type="button" class="toast__close" data-toast-close aria-label="Dismiss">&times;</button>
    </div>
</div>

<!--/* Replaced by the page's own <main>. */-->
<main id="content" th:replace="${content}">
    <p>Page content goes here.</p>
</main>

<footer class="site-footer">
    <div class="site-footer__inner">
        <p class="site-footer__note">
            NextTenant &middot; Shared flats in Mumbai &middot; No brokers, no owners, no PGs
        </p>
        <p class="site-footer__safety">
            Never pay a deposit before visiting in person.
        </p>
    </div>
</footer>

<script th:src="@{/js/toasts.js}" src="/js/toasts.js" defer></script>
<script th:src="@{/js/shortlist.js}" src="/js/shortlist.js" defer></script>
<script th:src="@{/js/forms.js}" src="/js/forms.js" defer></script>

</body>
</html>
