# Test-only overrides.
#
# A .properties file rather than an application.yml, deliberately. Spring Boot
# resolves classpath:/application.yml to the FIRST one on the classpath, and
# test resources come before main resources — so a test application.yml would
# shadow the real configuration entirely and silently, taking the connection
# pool, Flyway, session and upload settings with it. A .properties file is a
# different filename, so BOTH are loaded and these keys simply win.

# The test database, created by docker/initdb/01-test-database.sql. Tests used
# to run against the development database and leave their fixtures behind in it.
spring.datasource.url=jdbc:postgresql://localhost:5432/nexttenant_test
